  <rect x="276" y="134" width="216" height="46" rx="8" class="head"/>
  <text x="292" y="156" class="t-head">Calculadora</text>
  <text x="292" y="171" class="t-headsub">calculator.js · costing.js</text>
  <path d="M384 180 L384 196" class="conn"/>
  <rect x="276" y="196" width="216" height="30" rx="6" class="box"/>
  <text x="292" y="215" class="t-item">01 · Pieza</text>
  <rect x="276" y="234" width="216" height="30" rx="6" class="box"/>
  <text x="292" y="253" class="t-item">02 · Impresora y material</text>
  <rect x="276" y="272" width="216" height="30" rx="6" class="box"/>
  <text x="292" y="291" class="t-item">Bloque Resina</text>
  <rect x="276" y="310" width="216" height="30" rx="6" class="box"/>
