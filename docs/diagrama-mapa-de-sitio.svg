  <rect x="512" y="272" width="216" height="30" rx="6" class="box"/>
  <text x="528" y="291" class="t-item">Exportar PDF e imagen</text>
  <rect x="512" y="310" width="216" height="30" rx="6" class="box"/>
  <text x="528" y="329" class="t-item">WhatsApp y QR</text>
  <rect x="512" y="348" width="216" height="30" rx="6" class="box"/>
  <text x="528" y="367" class="t-item">Sincronización con Notion</text>
  <rect x="512" y="386" width="216" height="30" rx="6" class="box"/>
  <text x="528" y="405" class="t-item">Clientes</text>

