<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="Plus Jakarta Sans, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <style>
      .t-title   { font-size: 22px; font-weight: 700; fill: #111814; letter-spacing: -0.4px; }
      .t-sub     { font-size: 12px; font-weight: 400; fill: #69756E; }
      .t-section { font-size: 10px; font-weight: 700; fill: #69756E; letter-spacing: 1.2px; }
      .t-head    { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
      .t-headsub { font-size: 9px;  font-weight: 500; fill: #BFE8D8; letter-spacing: 0.3px; }
      .t-item    { font-size: 11px; font-weight: 500; fill: #22302A; }
      .t-prop    { font-size: 11px; font-weight: 600; fill: #3E4A43; }
      .t-propsub { font-size: 9px;  font-weight: 400; fill: #8A948E; }
      .t-leg     { font-size: 10px; font-weight: 500; fill: #69756E; }
      .box       { fill: #FFFFFF; stroke: #DCE3DF; stroke-width: 1; }
      .head      { fill: #0A7A58; }
      .prop      { fill: #F4F7F5; stroke: #B9C4BD; stroke-width: 1; stroke-dasharray: 4 3; }
      .conn      { stroke: #CBD4CE; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <rect width="1240" height="700" fill="#FBFCFB"/>

  <text x="40" y="48" class="t-title">Mapa de sitio — Calculadora 3D</text>
  <text x="40" y="70" class="t-sub">La Casita del Molde · aplicación de página única: todas las pantallas existen en el DOM y showPage() alterna su visibilidad</text>

  <text x="40" y="118" class="t-section">PANTALLAS ACTUALES</text>

  <!-- ══ Columna 1 — Inicio ══ -->
  <rect x="40" y="134" width="216" height="46" rx="8" class="head"/>
  <text x="56" y="156" class="t-head">Inicio</text>
  <text x="56" y="171" class="t-headsub">dashboard.js</text>
  <path d="M148 180 L148 196" class="conn"/>
  <rect x="40" y="196" width="216" height="30" rx="6" class="box"/>
  <text x="56" y="215" class="t-item">Ingresos y margen del mes</text>
  <rect x="40" y="234" width="216" height="30" rx="6" class="box"/>
  <text x="56" y="253" class="t-item">Historial de 6 meses</text>
  <rect x="40" y="272" width="216" height="30" rx="6" class="box"/>
  <text x="56" y="291" class="t-item">Cotizaciones recientes</text>
  <rect x="40" y="310" width="216" height="30" rx="6" class="box"/>
  <text x="56" y="329" class="t-item">Salud del negocio</text>

