  <rect x="984" y="134" width="216" height="46" rx="8" class="head"/>
  <text x="1000" y="156" class="t-head">Ajustes</text>
  <text x="1000" y="171" class="t-headsub">config.js · quote-editor.js</text>
  <path d="M1092 180 L1092 196" class="conn"/>
  <rect x="984" y="196" width="216" height="30" rx="6" class="box"/>
  <text x="1000" y="215" class="t-item">Datos del negocio</text>
  <rect x="984" y="234" width="216" height="30" rx="6" class="box"/>
  <text x="1000" y="253" class="t-item">Cuenta bancaria</text>
  <rect x="984" y="272" width="216" height="30" rx="6" class="box"/>
  <text x="1000" y="291" class="t-item">Electricidad y trabajo</text>
  <rect x="984" y="310" width="216" height="30" rx="6" class="box"/>
  <text x="1000" y="329" class="t-item">Gastos fijos</text>
  <rect x="984" y="348" width="216" height="30" rx="6" class="box"/>
  <text x="1000" y="367" class="t-item">Gastos indirectos</text>
  <rect x="984" y="386" width="216" height="30" rx="6" class="box"/>
