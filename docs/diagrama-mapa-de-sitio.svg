  <rect x="984" y="424" width="216" height="30" rx="6" class="box"/>
  <text x="1000" y="443" class="t-item">Diseño de cotización</text>

  <!-- ══ Propuesto ══ -->
  <line x1="40" y1="492" x2="1200" y2="492" stroke="#E2E6E3" stroke-width="1"/>
  <text x="40" y="522" class="t-section">POR CONSTRUIR</text>

  <rect x="40" y="538" width="216" height="52" rx="8" class="prop"/>
  <text x="56" y="560" class="t-prop">Insumos y herrajes</text>
  <text x="56" y="576" class="t-propsub">imanes, argollas, tornillería</text>

  <rect x="276" y="538" width="216" height="52" rx="8" class="prop"/>
  <text x="292" y="560" class="t-prop">Órdenes de compra</text>
  <text x="292" y="576" class="t-propsub">cruza cotización con inventario</text>

  <rect x="512" y="538" width="216" height="52" rx="8" class="prop"/>
  <text x="528" y="560" class="t-prop">Producción</text>
  <text x="528" y="576" class="t-propsub">en cola → imprimiendo → entregada</text>

  <rect x="748" y="538" width="216" height="52" rx="8" class="prop"/>
  <text x="764" y="560" class="t-prop">Autenticación</text>
  <text x="764" y="576" class="t-propsub">Firebase Auth · multi-dispositivo</text>

  <rect x="984" y="538" width="216" height="52" rx="8" class="prop"/>
  <text x="1000" y="560" class="t-prop">Portal del cliente</text>
  <text x="1000" y="576" class="t-propsub">requiere URLs y autenticación</text>

  <!-- ══ Leyenda ══ -->
  <rect x="40" y="626" width="14" height="14" rx="3" class="head"/>
  <text x="62" y="637" class="t-leg">Sección principal</text>

  <rect x="190" y="626" width="14" height="14" rx="3" class="box"/>
  <text x="212" y="637" class="t-leg">Pantalla o bloque existente</text>

  <rect x="404" y="626" width="14" height="14" rx="3" class="prop"/>
  <text x="426" y="637" class="t-leg">Propuesto — ver docs/MAPA-DE-SITIO.md</text>

  <text x="1200" y="637" class="t-leg" text-anchor="end">Octubre 2026</text>
