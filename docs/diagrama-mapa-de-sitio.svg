  <rect x="748" y="134" width="216" height="46" rx="8" class="head"/>
  <text x="764" y="156" class="t-head">Catálogo</text>
  <text x="764" y="171" class="t-headsub">catalog.js · inventory.js</text>
  <path d="M856 180 L856 196" class="conn"/>
  <rect x="748" y="196" width="216" height="30" rx="6" class="box"/>
  <text x="764" y="215" class="t-item">Productos y tabla de precios</text>
  <rect x="748" y="234" width="216" height="30" rx="6" class="box"/>
  <text x="764" y="253" class="t-item">Impresoras</text>
  <rect x="748" y="272" width="216" height="30" rx="6" class="box"/>
  <text x="764" y="291" class="t-item">Materiales</text>
  <rect x="748" y="310" width="216" height="30" rx="6" class="box"/>
  <text x="764" y="329" class="t-item">Inventario de filamento</text>
  <rect x="748" y="348" width="216" height="30" rx="6" class="box"/>
