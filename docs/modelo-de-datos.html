<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datos de un negocio · Modelo de datos</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + 0.75rem,2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:960px; display:block; }
    svg text { font-family:'Geist',sans-serif; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Modelo de datos · Diagrama entidad-relación</p>
    <h1>Datos de un negocio en Firebase</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="modelo-title modelo-desc">
      <title id="modelo-title">Datos de un negocio en Firebase</title>
      <desc id="modelo-desc">Modelo entidad-relación. La persona entra con su cuenta de Firebase a un negocio, del que es miembro. Dentro del negocio viven sus ajustes, sus catálogos, sus clientes, sus cotizaciones, sus pagos y sus rollos. La cotización es el centro: un cliente pide varias, cada una se paga con varios pagos y consume filamento de varios rollos, y cada rollo es de un material del catálogo.</desc>
      <defs>
        <pattern id="modelo-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#modelo-dots)" opacity="0.55"/>

      <!-- El negocio: todo lo de adentro es de él. -->
      <rect x="24" y="148" width="912" height="400" rx="8" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="240" y="168" fill="#5a6580" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">NEGOCIO · TODO LO DE ADENTRO VIVE EN negocios/{negocioId}</text>

      <!-- Nota al margen, fuera del negocio. -->
      <text x="264" y="44" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">FUERA DEL NEGOCIO</text>
      <text x="264" y="60" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace">Firebase Authentication guarda la cuenta y la contraseña;</text>
      <text x="264" y="72" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace">usuarios/{uid} solo dice a qué negocio entra la persona.</text>
      <text x="264" y="84" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace">En la primera versión, una persona por negocio.</text>

      <!-- Relaciones, dibujadas antes que las cajas. -->
      <line x1="128" y1="132" x2="128" y2="184" stroke="#4f5d75" stroke-width="1"/>
      <line x1="400" y1="316" x2="400" y2="364" stroke="#4f5d75" stroke-width="1"/>
      <line x1="216" y1="440" x2="288" y2="440" stroke="#4f5d75" stroke-width="1"/>
      <line x1="512" y1="440" x2="736" y2="440" stroke="#4f5d75" stroke-width="1"/>
      <line x1="828" y1="316" x2="828" y2="364" stroke="#4f5d75" stroke-width="1"/>

      <text x="56" y="52" fill="#2d3142" font-size="14" font-weight="600">Persona</text>
