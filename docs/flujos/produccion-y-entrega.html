<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producción y entrega · Diagrama de decisiones</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + 0.75rem,2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:960px; display:block; }
    svg text { font-family:'Geist',sans-serif; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flujo 5 · Diagrama de decisiones</p>
    <h1>Producción y entrega</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="produccion-entrega-title produccion-entrega-desc">
      <title id="produccion-entrega-title">Producción y entrega</title>
      <desc id="produccion-entrega-desc">Una cotización aceptada se elige de la lista por fecha de entrega y se empieza a producir; si el filamento del rollo no alcanza se elige otro, se descuenta el filamento, se imprime y se entrega completa.</desc>
      <defs>
        <pattern id="produccion-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="produccion-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="produccion-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#produccion-dots)" opacity="0.55"/>

      <!-- Flechas, dibujadas antes que los nodos. -->
      <line x1="480" y1="76" x2="480" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#produccion-arrow)"/>
      <line x1="480" y1="144" x2="480" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#produccion-arrow)"/>
      <line x1="600" y1="208" x2="672" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#produccion-arrow)"/>
      <line x1="480" y1="248" x2="480" y2="284" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M780 230 V280 A8 8 0 0 1 772 288 H484" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="480" y1="292" x2="480" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#produccion-arrow)"/>
      <line x1="480" y1="356" x2="480" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#produccion-arrow)"/>
      <line x1="480" y1="424" x2="480" y2="456" stroke="#bf4520" stroke-width="1.4" marker-end="url(#produccion-arrow-accent)"/>

      <!-- Etiquetas sobre máscara opaca. -->
      <g font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.12em" fill="#4f5d75">
        <rect x="624" y="190" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="636" y="199">NO</text>
        <rect x="488" y="258" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="500" y="267">SÍ</text>
        <rect x="488" y="434" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="520" y="443" fill="#bf4520">ENTREGAR</text>
      </g>

      <!-- Inicio -->
      <rect x="396" y="32" width="168" height="44" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
      <text x="480" y="53" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Aceptada</text>
      <text x="480" y="67" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">con fecha de entrega</text>

      <rect x="380" y="100" width="200" height="44" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="480" y="119" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Empezar producción</text>
      <text x="480" y="134" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">desde la lista por fecha</text>

      <!-- Decisión: filamento -->
      <polygon points="480,168 600,208 480,248 360,208" fill="#fff" stroke="#2d3142"/>
      <text x="480" y="205" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">¿Alcanza el</text>
      <text x="480" y="219" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">filamento?</text>

      <rect x="672" y="186" width="216" height="44" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="780" y="205" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Elegir otro rollo</text>
      <text x="780" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">para lo que falta</text>

      <circle cx="480" cy="288" r="4" fill="#2d3142"/>

      <rect x="380" y="312" width="200" height="44" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="480" y="331" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Descontar filamento</text>
      <text x="480" y="346" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">vuelve si se regresa un paso</text>

      <rect x="380" y="380" width="200" height="44" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="480" y="399" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Imprimir y terminar</text>
      <text x="480" y="414" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">fuera de la app</text>

      <!-- Fin, en color: es el resultado que se busca. -->
      <rect x="396" y="456" width="168" height="44" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
      <text x="480" y="477" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Entregada</text>
      <text x="480" y="491" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">completa · saldo en flujo 4</text>

      <!-- Reglas al margen: notas, no flechas. -->
      <text x="672" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">SI FALTA EL ANTICIPO</text>
      <text x="672" y="114" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace">«Empezar producción» avisa</text>
      <text x="672" y="126" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace">y deja seguir</text>
      <text x="40" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">SI UNA PIEZA FALLA</text>
      <text x="40" y="394" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace">el filamento extra se descuenta</text>
      <text x="40" y="406" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace">a mano en Inventario</text>

      <!-- Leyenda -->
      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEYENDA · LA FORMA DICE EL TIPO</text>
      <rect x="40" y="572" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
      <text x="72" y="582" fill="#4f5d75" font-size="8.5">Inicio o fin</text>
      <rect x="196" y="572" width="24" height="12" rx="2" fill="#fff" stroke="#2d3142"/>
      <text x="228" y="582" fill="#4f5d75" font-size="8.5">Paso</text>
      <polygon points="328,578 340,572 352,578 340,584" fill="#fff" stroke="#2d3142"/>
      <text x="360" y="582" fill="#4f5d75" font-size="8.5">Decisión</text>
      <circle cx="476" cy="578" r="4" fill="#2d3142"/>
      <text x="488" y="582" fill="#4f5d75" font-size="8.5">Se juntan los caminos</text>
      <line x1="640" y1="578" x2="668" y2="578" stroke="#bf4520" stroke-width="1.4" marker-end="url(#produccion-arrow-accent)"/>
      <text x="676" y="582" fill="#4f5d75" font-size="8.5">Llega al resultado</text>
    </svg>
  </div>
</body>
</html>
