<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar y aceptar · Diagrama de decisiones</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + 0.75rem,2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:960px; display:block; }
    svg text { font-family:'Geist',sans-serif; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flujo 3 · Diagrama de decisiones</p>
    <h1>Enviar y aceptar</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="enviar-aceptar-title enviar-aceptar-desc">
      <title id="enviar-aceptar-title">Enviar y aceptar</title>
      <desc id="enviar-aceptar-desc">La cotización en Borrador se comparte con el cliente; si pide cambios regresa a Borrador, si la rechaza termina, y si la acepta se registra el anticipo cuando se pide y se fija la fecha de entrega.</desc>
      <defs>
        <pattern id="enviar-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="enviar-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="enviar-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#enviar-dots)" opacity="0.55"/>

      <!-- Flechas, dibujadas antes que los nodos. -->
      <line x1="480" y1="76" x2="480" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#enviar-arrow)"/>
      <line x1="480" y1="144" x2="480" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#enviar-arrow)"/>
      <line x1="600" y1="208" x2="672" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#enviar-arrow)"/>
      <path d="M360 208 H128 A8 8 0 0 1 120 200 V62 A8 8 0 0 1 128 54 H396" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#enviar-arrow)"/>
      <line x1="480" y1="248" x2="480" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#enviar-arrow)"/>
      <line x1="592" y1="312" x2="672" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#enviar-arrow)"/>
      <line x1="480" y1="352" x2="480" y2="384" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M780 334 V380 A8 8 0 0 1 772 388 H484" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="480" y1="392" x2="480" y2="412" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#enviar-arrow)"/>
      <line x1="480" y1="456" x2="480" y2="480" stroke="#bf4520" stroke-width="1.4" marker-end="url(#enviar-arrow-accent)"/>

      <!-- Etiquetas de cada salida de decisión, sobre máscara opaca. -->
      <g font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.12em" fill="#4f5d75">
        <rect x="612" y="190" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="636" y="199">RECHAZA</text>
        <rect x="196" y="190" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="236" y="199">PIDE CAMBIOS</text>
        <rect x="488" y="254" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="510" y="263">ACEPTA</text>
        <rect x="620" y="294" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="632" y="303">SÍ</text>
        <rect x="488" y="362" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="500" y="371">NO</text>
      </g>

      <!-- Nota al margen: la vigencia no es un estado. -->
      <text x="920" y="146" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif',serif" text-anchor="end">si no contesta, la lista avisa al vencer la vigencia</text>
      <path d="M 690 156 Q 630 168 574 196" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="574" cy="196" r="2" fill="#2d3142"/>

      <!-- Inicio -->
      <rect x="396" y="32" width="168" height="44" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
      <text x="480" y="53" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Borrador</text>
      <text x="480" y="67" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">cotización armada</text>

      <rect x="380" y="100" width="200" height="44" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="480" y="119" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Compartir</text>
      <text x="480" y="134" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">WhatsApp o liga · pasa a Enviada</text>

      <!-- Decisión: respuesta del cliente -->
      <polygon points="480,168 600,208 480,248 360,208" fill="#fff" stroke="#2d3142"/>
      <text x="480" y="205" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">¿Qué responde</text>
      <text x="480" y="219" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">el cliente?</text>

      <rect x="672" y="186" width="168" height="44" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
      <text x="756" y="207" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Rechazada</text>
      <text x="756" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">salida final</text>

      <!-- Decisión: anticipo -->
      <polygon points="480,272 592,312 480,352 368,312" fill="#fff" stroke="#2d3142"/>
      <text x="480" y="316" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">¿Pide anticipo?</text>

      <rect x="672" y="290" width="216" height="44" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="780" y="309" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Registrar el anticipo</text>
      <text x="780" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">con recibo para WhatsApp</text>

      <circle cx="480" cy="388" r="4" fill="#2d3142"/>

      <rect x="380" y="412" width="200" height="44" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="480" y="431" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Fijar fecha de entrega</text>
      <text x="480" y="446" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">plazo en días hábiles</text>

      <!-- Fin, en color: es el resultado que se busca. -->
      <rect x="396" y="480" width="168" height="44" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
      <text x="480" y="501" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Aceptada</text>
      <text x="480" y="515" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">con fecha · sigue el flujo 5</text>

      <!-- Leyenda -->
      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEYENDA · LA FORMA DICE EL TIPO</text>
      <rect x="40" y="572" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
      <text x="72" y="582" fill="#4f5d75" font-size="8.5">Inicio o fin</text>
      <rect x="180" y="572" width="24" height="12" rx="2" fill="#fff" stroke="#2d3142"/>
      <text x="212" y="582" fill="#4f5d75" font-size="8.5">Paso</text>
      <polygon points="296,578 308,572 320,578 308,584" fill="#fff" stroke="#2d3142"/>
      <text x="328" y="582" fill="#4f5d75" font-size="8.5">Decisión</text>
      <circle cx="428" cy="578" r="4" fill="#2d3142"/>
      <text x="440" y="582" fill="#4f5d75" font-size="8.5">Se juntan los caminos</text>
      <line x1="572" y1="578" x2="600" y2="578" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#enviar-arrow)"/>
      <text x="608" y="582" fill="#4f5d75" font-size="8.5">Regresa a un paso anterior</text>
      <line x1="756" y1="578" x2="784" y2="578" stroke="#bf4520" stroke-width="1.4" marker-end="url(#enviar-arrow-accent)"/>
      <text x="792" y="582" fill="#4f5d75" font-size="8.5">Llega al resultado</text>
    </svg>
  </div>
</body>
</html>
