<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estados de la cotización · Diagrama de estados</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + 0.75rem,2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:960px; display:block; }
    svg text { font-family:'Geist',sans-serif; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flujo 1 · Diagrama de estados</p>
    <h1>Estados de la cotización</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="estados-cotizacion-title estados-cotizacion-desc">
      <title id="estados-cotizacion-title">Estados de la cotización</title>
      <desc id="estados-cotizacion-desc">Una cotización pasa por Borrador, Enviada, Aceptada, En producción y Entregada; puede terminar Rechazada antes de aceptarse o Cancelada después, y desde cualquier estado se puede regresar un paso.</desc>
      <defs>
        <pattern id="estados-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="estados-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="estados-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#estados-dots)" opacity="0.55"/>
      <rect x="24" y="424" width="912" height="116" rx="8" fill="rgba(45,49,66,0.035)" stroke="rgba(45,49,66,0.12)"/>
      <text x="40" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">FASES PRINCIPALES</text>
      <text x="40" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">SALIDAS FINALES</text>

      <!-- Diez transiciones con etiqueta, dibujadas antes que los estados. -->
      <line x1="46" y1="236" x2="64" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#estados-arrow)"/>
      <line x1="200" y1="224" x2="248" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#estados-arrow)"/>
      <line x1="248" y1="248" x2="200" y2="248" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#estados-arrow)"/>
      <path d="M132 200 V156 A8 8 0 0 1 140 148 H492 A8 8 0 0 1 500 156 V200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#estados-arrow)"/>
      <line x1="384" y1="236" x2="432" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#estados-arrow)"/>
      <line x1="568" y1="236" x2="616" y2="236" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#estados-arrow)"/>
      <line x1="752" y1="236" x2="800" y2="236" stroke="#bf4520" stroke-width="1.4" marker-end="url(#estados-arrow-accent)"/>
      <line x1="316" y1="272" x2="316" y2="452" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#estados-arrow)"/>
      <path d="M500 272 V352 A8 8 0 0 0 508 360 H560 A8 8 0 0 1 568 368 V452" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#estados-arrow)"/>
      <path d="M684 272 V372 A8 8 0 0 1 676 380 H624 A8 8 0 0 0 616 388 V452" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#estados-arrow)"/>

      <!-- Máscaras opacas: cada etiqueta queda separada de su línea. -->
      <g font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em" fill="#4f5d75">
        <rect x="202" y="206" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="224" y="215">ENVIAR</text>
        <rect x="202" y="254" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="224" y="263">EDITAR</text>
        <rect x="292" y="130" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="316" y="139">ACEPTAR</text>
        <rect x="386" y="218" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="408" y="227">ACEPTAR</text>
        <rect x="570" y="218" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="592" y="227">PRODUCIR</text>
        <rect x="754" y="218" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="776" y="227" fill="#bf4520">ENTREGAR</text>
        <rect x="322" y="344" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="346" y="353">RECHAZAR</text>
        <rect x="446" y="300" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="470" y="309">CANCELAR</text>
        <rect x="690" y="300" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="714" y="309">CANCELAR</text>
      </g>

      <circle cx="40" cy="236" r="6" fill="#2d3142"/>

      <!-- Fases principales: cinco estados. -->
      <g font-family="'Geist',sans-serif" text-anchor="middle">
        <g><rect x="64" y="200" width="136" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="132" y="231" fill="#2d3142" font-size="12" font-weight="600">Borrador</text><text x="132" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">se arma y se edita</text></g>
        <g><rect x="248" y="200" width="136" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="316" y="231" fill="#2d3142" font-size="12" font-weight="600">Enviada</text><text x="316" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">vigencia con aviso</text></g>
        <g><rect x="432" y="200" width="136" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="500" y="231" fill="#2d3142" font-size="12" font-weight="600">Aceptada</text><text x="500" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">anticipo y fecha</text></g>
        <g><rect x="616" y="200" width="136" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="684" y="231" fill="#2d3142" font-size="12" font-weight="600">En producción</text><text x="684" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">descuenta filamento</text></g>
        <g><rect x="800" y="200" width="136" height="72" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/><circle cx="820" cy="220" r="7" fill="none" stroke="#bf4520"/><circle cx="820" cy="220" r="4" fill="#bf4520"/><text x="868" y="231" fill="#2d3142" font-size="12" font-weight="600">Entregada</text><text x="868" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">puede quedar saldo</text></g>
      </g>

      <!-- Salidas finales: texto, etiqueta y trazo las distinguen, no solo el color. -->
      <g text-anchor="middle">
        <g><rect x="248" y="452" width="136" height="72" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75"/><rect x="258" y="462" width="34" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)"/><text x="275" y="471" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">FINAL</text><text x="316" y="495" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Rechazada</text><text x="316" y="510" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">también desde Borrador</text></g>
        <g><rect x="524" y="452" width="136" height="72" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="3,3"/><rect x="534" y="462" width="34" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)"/><text x="551" y="471" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">FINAL</text><text x="592" y="495" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Cancelada</text><text x="592" y="510" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">anticipo: ventana 2 días</text></g>
      </g>

      <!-- Regla para todos los estados: una nota, no una flecha desde cada uno. -->
      <text x="40" y="392" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">DESDE CUALQUIER ESTADO</text>
      <text x="40" y="406" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace">regresar un paso deshace</text>
      <text x="40" y="418" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace">filamento y fechas; los pagos se quedan</text>
    </svg>
  </div>
</body>
</html>
