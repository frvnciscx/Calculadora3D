<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De la calculadora a la cotización · Diagrama de decisiones</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + 0.75rem,2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:960px; display:block; }
    svg text { font-family:'Geist',sans-serif; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flujo 2 · Diagrama de decisiones</p>
    <h1>De la calculadora a la cotización</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="calculadora-cotizacion-title calculadora-cotizacion-desc">
      <title id="calculadora-cotizacion-title">De la calculadora a la cotización</title>
      <desc id="calculadora-cotizacion-desc">Cada pieza se llena leyendo el archivo laminado del slicer o capturándola a mano; después se completa y se agrega a la orden, y al terminar las piezas se arma la cotización, que se guarda como Borrador.</desc>
      <defs>
        <pattern id="calc-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="calc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="calc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#calc-dots)" opacity="0.55"/>

      <!-- Flechas, dibujadas antes que los nodos. -->
      <line x1="480" y1="76" x2="480" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#calc-arrow)"/>
      <line x1="592" y1="140" x2="672" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#calc-arrow)"/>
      <line x1="480" y1="180" x2="480" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#calc-arrow)"/>
      <line x1="480" y1="252" x2="480" y2="276" stroke="#4f5d75" stroke-width="1.2"/>
      <path d="M780 162 V272 A8 8 0 0 1 772 280 H484" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
      <line x1="480" y1="284" x2="480" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#calc-arrow)"/>
      <line x1="480" y1="348" x2="480" y2="372" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#calc-arrow)"/>
      <path d="M380 412 H128 A8 8 0 0 1 120 404 V62 A8 8 0 0 1 128 54 H396" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#calc-arrow)"/>
      <line x1="580" y1="412" x2="672" y2="412" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#calc-arrow)"/>
      <line x1="780" y1="434" x2="780" y2="468" stroke="#bf4520" stroke-width="1.4" marker-end="url(#calc-arrow-accent)"/>

      <!-- Etiquetas de cada salida de decisión, sobre máscara opaca. -->
      <g font-family="'Geist Mono',monospace" font-size="8" text-anchor="middle" letter-spacing="0.12em" fill="#4f5d75">
        <rect x="620" y="122" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="632" y="131">SÍ</text>
        <rect x="488" y="188" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="500" y="197">NO</text>
        <rect x="240" y="394" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="252" y="403">SÍ</text>
        <rect x="614" y="394" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="626" y="403">NO</text>
      </g>

      <!-- Inicio -->
      <rect x="396" y="32" width="168" height="44" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
      <text x="480" y="53" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Nueva pieza</text>
      <text x="480" y="67" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">en la calculadora</text>

      <!-- Decisión: ¿archivo laminado? -->
      <polygon points="480,100 592,140 480,180 368,140" fill="#fff" stroke="#2d3142"/>
      <text x="480" y="137" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">¿Tienes el archivo</text>
      <text x="480" y="151" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">laminado?</text>

      <!-- Pasos -->
      <rect x="672" y="118" width="216" height="44" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="780" y="137" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Leer el archivo</text>
      <text x="780" y="152" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">peso por color · tiempo · miniatura</text>

      <rect x="380" y="208" width="200" height="44" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="480" y="227" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Capturar a mano</text>
      <text x="480" y="242" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">peso · horas y minutos · piezas</text>

      <circle cx="480" cy="280" r="4" fill="#2d3142"/>

      <rect x="380" y="304" width="200" height="44" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="480" y="323" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Completar y agregar</text>
      <text x="480" y="338" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">rollos · insumos · margen · cantidad</text>

      <!-- Decisión: ¿otra pieza? -->
      <polygon points="480,372 580,412 480,452 380,412" fill="#fff" stroke="#2d3142"/>
      <text x="480" y="416" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">¿Otra pieza?</text>

      <rect x="672" y="390" width="216" height="44" rx="6" fill="#fff" stroke="#2d3142"/>
      <text x="780" y="409" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Armar la cotización</text>
      <text x="780" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">cliente · cargos · anticipo · plazo</text>

      <!-- Fin, en color: es el resultado que se busca. -->
      <rect x="696" y="468" width="168" height="44" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/>
      <text x="780" y="489" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Borrador</text>
      <text x="780" y="503" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">sigue en el flujo 1</text>

      <!-- Leyenda -->
      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.18em">LEYENDA · LA FORMA DICE EL TIPO</text>
      <rect x="40" y="572" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
      <text x="72" y="582" fill="#4f5d75" font-size="8.5">Inicio o fin</text>
      <rect x="196" y="572" width="24" height="12" rx="2" fill="#fff" stroke="#2d3142"/>
      <text x="228" y="582" fill="#4f5d75" font-size="8.5">Paso</text>
      <polygon points="328,578 340,572 352,578 340,584" fill="#fff" stroke="#2d3142"/>
      <text x="360" y="582" fill="#4f5d75" font-size="8.5">Decisión</text>
      <circle cx="476" cy="578" r="4" fill="#2d3142"/>
      <text x="488" y="582" fill="#4f5d75" font-size="8.5">Se juntan los caminos</text>
      <line x1="640" y1="578" x2="668" y2="578" stroke="#bf4520" stroke-width="1.4" marker-end="url(#calc-arrow-accent)"/>
      <text x="676" y="582" fill="#4f5d75" font-size="8.5">Llega al resultado</text>
    </svg>
  </div>
</body>
</html>
