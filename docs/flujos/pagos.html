<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagos de una cotización · Diagrama de estados</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#bf4520; --font-sans:'Geist',system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + 0.75rem,2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:960px; display:block; }
    svg text { font-family:'Geist',sans-serif; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flujo 4 · Diagrama de estados</p>
    <h1>Pagos de una cotización</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pagos-title pagos-desc">
      <title id="pagos-title">Pagos de una cotización</title>
      <desc id="pagos-desc">Después de aceptar, el pago pasa de esperar el anticipo a anticipo incompleto, a con saldo cuando el anticipo se cubre, y a pagada al liquidar; si se cancela con pagos hechos, se registra la devolución según la ventana de dos días hábiles.</desc>
      <defs>
        <pattern id="pagos-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
        <marker id="pagos-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="pagos-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#pagos-dots)" opacity="0.55"/>
      <rect x="24" y="424" width="912" height="116" rx="8" fill="rgba(45,49,66,0.035)" stroke="rgba(45,49,66,0.12)"/>
      <text x="40" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">ESTADO DEL PAGO</text>
      <text x="40" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">SALIDA FINAL</text>

      <!-- Ocho transiciones con etiqueta, dibujadas antes que los estados. -->
      <line x1="46" y1="252" x2="64" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pagos-arrow)"/>
      <line x1="224" y1="252" x2="288" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pagos-arrow)"/>
      <path d="M144 216 V168 A8 8 0 0 1 152 160 H544 A8 8 0 0 1 552 168 V216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pagos-arrow)"/>
      <line x1="448" y1="252" x2="512" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pagos-arrow)"/>
      <path d="M592 216 V192 A8 8 0 0 1 600 184 H624 A8 8 0 0 1 632 192 V216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pagos-arrow)"/>
      <line x1="672" y1="252" x2="736" y2="252" stroke="#bf4520" stroke-width="1.4" marker-end="url(#pagos-arrow-accent)"/>
      <path d="M368 288 V352 A8 8 0 0 0 376 360 H444 A8 8 0 0 1 452 368 V452" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pagos-arrow)"/>
      <path d="M592 288 V372 A8 8 0 0 1 584 380 H516 A8 8 0 0 0 508 388 V452" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pagos-arrow)"/>

      <!-- Máscaras opacas: cada etiqueta queda separada de su línea. -->
      <g font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em" fill="#4f5d75">
        <rect x="228" y="234" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="256" y="243">PAGO MENOR</text>
        <rect x="310" y="142" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="348" y="151">CUBRE ANTICIPO</text>
        <rect x="456" y="234" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="480" y="243">COMPLETA</text>
        <rect x="596" y="166" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="612" y="175">ABONO</text>
        <rect x="676" y="234" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="704" y="243" fill="#bf4520">PAGA SALDO</text>
        <rect x="314" y="314" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="338" y="323">CANCELAR</text>
        <rect x="598" y="314" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="622" y="323">CANCELAR</text>
      </g>

      <circle cx="40" cy="252" r="6" fill="#2d3142"/>

      <!-- Estados del pago. -->
      <g font-family="'Geist',sans-serif" text-anchor="middle">
        <g><rect x="64" y="216" width="160" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="144" y="247" fill="#2d3142" font-size="12" font-weight="600">Esperando anticipo</text><text x="144" y="266" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">pagado: $0</text></g>
        <g><rect x="288" y="216" width="160" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="368" y="247" fill="#2d3142" font-size="12" font-weight="600">Anticipo incompleto</text><text x="368" y="266" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">el plazo no corre</text></g>
        <g><rect x="512" y="216" width="160" height="72" rx="8" fill="#fff" stroke="#2d3142"/><text x="592" y="247" fill="#2d3142" font-size="12" font-weight="600">Con saldo</text><text x="592" y="266" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">corre el plazo</text></g>
        <g><rect x="736" y="216" width="160" height="72" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520"/><circle cx="756" cy="236" r="7" fill="none" stroke="#bf4520"/><circle cx="756" cy="236" r="4" fill="#bf4520"/><text x="816" y="247" fill="#2d3142" font-size="12" font-weight="600">Pagada</text><text x="816" y="266" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">saldo $0</text></g>
      </g>

      <!-- Salida final. -->
      <g text-anchor="middle">
        <g><rect x="400" y="452" width="160" height="72" rx="8" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="3,3"/><rect x="410" y="462" width="34" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.45)"/><text x="427" y="471" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace">FINAL</text><text x="480" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Devolución</text><text x="480" y="506" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">todo, si van ≤ 2 días hábiles</text><text x="480" y="518" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">después, $0 (editable)</text></g>
      </g>

      <!-- Reglas que aplican a todos los estados: notas, no flechas. -->
      <text x="736" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">CADA PAGO</text>
      <text x="736" y="114" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace">genera su recibo para WhatsApp</text>
      <text x="736" y="126" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace">y cuenta en el mes en que entra</text>
      <text x="40" y="392" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">SIN ANTICIPO</text>
      <text x="40" y="406" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace">si la cotización no lo pide,</text>
      <text x="40" y="418" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace">empieza en «Con saldo»</text>
    </svg>
  </div>
</body>
</html>
