<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>La Casita del Molde — Calculadora 3D</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "theme": "dark"
  }/*EDITMODE-END*/;
  (function() {
    const stored = localStorage.getItem('lcdm_theme');
    const t = stored || TWEAK_DEFAULTS.theme || 'dark';
    if (t === 'light' || (t === 'auto' && window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="page-home.jsx"></script>
<script type="text/babel" src="page-calc.jsx"></script>
<script type="text/babel" src="page-quotes.jsx"></script>
<script type="text/babel" src="page-catalog.jsx"></script>
<script type="text/babel" src="page-settings.jsx"></script>
<script type="text/babel" src="page-generate.jsx"></script>
<script type="text/babel" src="page-new-client.jsx"></script>

<script type="text/babel">
function App() {
  const [page, setPage] = React.useState(() => localStorage.getItem('lcdm_page') || 'home');
  const [theme, setThemeState] = React.useState(() => localStorage.getItem('lcdm_theme') || TWEAK_DEFAULTS.theme || 'dark');
  const [currency, setCurrency] = React.useState(() => localStorage.getItem('lcdm_currency') || 'MXN');
  const [tweaksOpen, setTweaksOpen] = React.useState(false);

  // Apply theme
  React.useEffect(() => {
    const apply = (t) => {
      if (t === 'light' || (t === 'auto' && !window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
    };
    apply(theme);
    localStorage.setItem('lcdm_theme', theme);
    // Sync tweak persistence
    try {
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { theme } }, '*');
    } catch (e) {}
  }, [theme]);

  const setTheme = (t) => setThemeState(t);

  // Persist page + currency
  React.useEffect(() => { localStorage.setItem('lcdm_page', page); }, [page]);
  React.useEffect(() => { localStorage.setItem('lcdm_currency', currency); }, [currency]);

  // Tweaks protocol
  React.useEffect(() => {
    const handler = (e) => {
      if (!e.data || !e.data.type) return;
      if (e.data.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    try {
      window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    } catch (e) {}
    return () => window.removeEventListener('message', handler);
  }, []);

  const pageProps = { setPage, theme, setTheme, currency, setCurrency };

  return (
    <div className="app-shell" data-screen-label={page}>
      {page === 'home' && <HomePage {...pageProps} />}
      {page === 'calc' && <CalcPage {...pageProps} />}
      {page === 'quotes' && <QuotesPage {...pageProps} />}
      {page === 'catalog' && <CatalogPage {...pageProps} />}
      {page === 'settings' && <SettingsPage {...pageProps} />}
      {page === 'design' && <DesignPage {...pageProps} />}
      {page === 'generate' && <GenerateQuotePage {...pageProps} />}
      {page === 'new-client' && <NewClientPage {...pageProps} />}

      <BottomNav page={['design'].includes(page) ? 'settings' : page} setPage={setPage} />

      {tweaksOpen && (
        <div className="tweaks">
          <div className="tweaks-title">Tweaks</div>
          <div style={{ fontSize: 11, color: 'var(--ink-3)', marginBottom: 6 }}>Apariencia</div>
          <div className="seg" style={{ width: '100%', display: 'flex' }}>
            <button className={theme === 'light' ? 'active' : ''} onClick={() => setTheme('light')} style={{ flex: 1, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 4 }}>
              <IcSun size={12} /> Claro
            </button>
            <button className={theme === 'dark' ? 'active' : ''} onClick={() => setTheme('dark')} style={{ flex: 1, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 4 }}>
              <IcMoon size={12} /> Oscuro
            </button>
            <button className={theme === 'auto' ? 'active' : ''} onClick={() => setTheme('auto')} style={{ flex: 1 }}>
              Auto
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
