<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Cotización</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Design Tokens — Quotia Identity ─────────────────────────── */
    :root {
      --bg:       #0D1210;
      --bg-card:  #151C18;
      --bg-sunk:  #090d0a;
      --accent:   #00E699;
      --ink:      #E4E8E5;
      --ink-2:    #B9C2BC;
      --ink-3:    #8B968F;
      --line:     #232D27;
      --ok:       #00E699;
      --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg:      #F8F9F8;
        --bg-card: #FFFFFF;
        --bg-sunk: #EFF1EF;
        --ink:     #111814;
        --ink-2:   #3E4A43;
        --ink-3:   #69756E;
        --line:    #E2E6E3;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      padding: 0 0 env(safe-area-inset-bottom, 20px);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ──────────────────────────────────────────────────── */
    .page-wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 16px 48px;
    }

    /* ── Header ──────────────────────────────────────────────────── */
    .q-header {
      padding: 28px 0 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 0.5px solid var(--line);
      margin-bottom: 20px;
    }
    .q-logo-wrap { flex-shrink: 0; }
    .q-logo-img  { height: 48px; width: auto; border-radius: 8px; object-fit: contain; }
    .q-logo-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .q-biz-contact {
      font-size: 12px;
      color: var(--ink-3);
      font-family: var(--font-mono);
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .q-meta {
      text-align: right;
    }
    .q-num {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--accent);
      background: color-mix(in oklab, var(--accent) 10%, transparent);
      border: 0.5px solid color-mix(in oklab, var(--accent) 25%, transparent);
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.06em;
      display: inline-block;
      margin-bottom: 8px;
    }
    .q-date {
      font-size: 12px;
      color: var(--ink-3);
      font-family: var(--font-mono);
    }

    /* ── Cliente ─────────────────────────────────────────────────── */
    .q-client-block {
      margin-bottom: 20px;
    }
    .q-label {
      font-size: 10px;
      font-family: var(--font-mono);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 4px;
    }
    .q-client-name {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    /* ── Items ───────────────────────────────────────────────────── */
    .q-items {
      border: 0.5px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .q-items-header {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      padding: 10px 16px;
      background: var(--bg-sunk);
      font-size: 10px;
      font-family: var(--font-mono);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .q-item {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      padding: 12px 16px;
      border-top: 0.5px solid var(--line);
      align-items: center;
    }
    .q-item:first-of-type { border-top: none; }
    .q-item-name {
      font-size: 14px;
      font-weight: 500;
    }
    .q-item-sub {
      font-size: 11px;
      color: var(--ink-3);
      font-family: var(--font-mono);
      margin-top: 2px;
    }
    .q-item-qty {
      font-size: 13px;
      color: var(--ink-2);
      text-align: center;
      font-family: var(--font-mono);
    }
    .q-item-price {
      font-size: 14px;
      font-weight: 500;
      text-align: right;
      font-family: var(--font-mono);
    }

    /* ── Totales ─────────────────────────────────────────────────── */
    .q-totals {
      border: 0.5px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .q-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-top: 0.5px solid var(--line);
      font-size: 13px;
    }
    .q-total-row:first-child { border-top: none; }
    .q-total-row.grand {
      background: var(--bg-sunk);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .q-total-row.grand .q-total-val {
      font-family: var(--font-mono);
      color: var(--accent);
      font-size: 18px;
    }
    .q-total-lbl { color: var(--ink-2); }
    .q-total-val { font-family: var(--font-mono); }

    /* ── Notas ───────────────────────────────────────────────────── */
    .q-notes {
      background: var(--bg-card);
      border: 0.5px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 13px;
      color: var(--ink-2);
      line-height: 1.55;
      margin-bottom: 20px;
    }
    .q-notes .q-label { margin-bottom: 6px; }

    /* ── Footer ──────────────────────────────────────────────────── */
    .q-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-top: 20px;
      border-top: 0.5px solid var(--line);
      flex-wrap: wrap;
    }
    .q-footer-biz {
      font-size: 12px;
      color: var(--ink-3);
      font-family: var(--font-mono);
    }
    .q-footer-biz strong { color: var(--ink-2); display: block; margin-bottom: 3px; }
    .q-qr img { height: 64px; width: 64px; border-radius: 6px; }

    /* ── Print button ────────────────────────────────────────────── */
    .q-print-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      background: var(--accent);
      color: #0D1210;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      width: 100%;
      justify-content: center;
      margin-bottom: 16px;
      transition: opacity 0.15s;
    }
    .q-print-btn:hover { opacity: 0.85; }

    /* ── Error / Loading ─────────────────────────────────────────── */
    .q-error {
      text-align: center;
      padding: 60px 24px;
    }
    .q-error h2 { font-size: 20px; margin-bottom: 8px; }
    .q-error p  { font-size: 14px; color: var(--ink-3); }

    /* ── Print styles ────────────────────────────────────────────── */
    @media print {
      body { background: #fff; color: #000; }
      .q-print-btn { display: none; }
      :root { --accent: #004D34; --bg-card: #FFFFFF; --bg-sunk: #EFF1EF; --line: #E2E6E3; --ink: #111814; --ink-2: #3E4A43; --ink-3: #69756E; }
    }
  </style>
</head>
<body>
  <div class="page-wrap" id="root">
    <div class="q-error" id="loading">
      <p style="color:var(--ink-3);font-size:14px;font-family:var(--font-mono)">Cargando cotización…</p>
    </div>
  </div>

  <script>
    function esc(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fmt(n, cur) {
      return (cur || '$') + Number(n || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function render(d) {
      var cur      = d.currency || '$';
      var items    = d.items    || [];
      var subtotal = items.reduce(function(s, it) { return s + (it.totalCost || 0) * (it.qty || 1); }, 0);
      var discount = d.discount || 0;
      var discAmt  = subtotal * (discount / 100);
      var total    = d.grandTotal != null ? d.grandTotal : (subtotal - discAmt);
      var dateStr  = d.quoteDate
        ? new Date(d.quoteDate).toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' })
        : '';

      document.title = (d.quoteNum || 'Cotización') + (d.bizName ? ' — ' + d.bizName : '');

      /* Logo / nombre del negocio */
      var logoHTML = d.logoDataUrl
        ? '<img class="q-logo-img" src="' + esc(d.logoDataUrl) + '" alt="' + esc(d.bizName) + '">'
        : '<div class="q-logo-name">' + esc(d.bizName || 'Cotización') + '</div>';

      /* Contacto del negocio */
      var contactLines = [];
      if (d.bizPhone) contactLines.push(esc(d.bizPhone));
      if (d.bizEmail) contactLines.push(esc(d.bizEmail));
      var contactHTML = contactLines.length
        ? '<div class="q-biz-contact">' + contactLines.join('<br>') + '</div>'
        : '';

      /* Items */
      var itemsHTML = items.map(function(it) {
        var qty     = it.qty || 1;
        var lineAmt = (it.totalCost || 0) * qty;
        var sub     = it.material ? '<div class="q-item-sub">' + esc(it.material) + '</div>' : '';
        return '<div class="q-item">' +
          '<div><div class="q-item-name">' + esc(it.desc || '') + '</div>' + sub + '</div>' +
          '<div class="q-item-qty">' + qty + '</div>' +
          '<div class="q-item-price">' + fmt(lineAmt, cur) + '</div>' +
        '</div>';
      }).join('');

      /* Totals */
      var totalsHTML = '';
      if (items.length > 1) {
        totalsHTML += '<div class="q-total-row"><span class="q-total-lbl">Subtotal</span><span class="q-total-val">' + fmt(subtotal, cur) + '</span></div>';
      }
      if (discount > 0) {
        totalsHTML += '<div class="q-total-row"><span class="q-total-lbl">Descuento ' + discount + '%</span><span class="q-total-val">−' + fmt(discAmt, cur) + '</span></div>';
      }
      totalsHTML += '<div class="q-total-row grand"><span>Total</span><span class="q-total-val">' + fmt(total, cur) + '</span></div>';

      /* Notes */
      var notesHTML = d.notes
        ? '<div class="q-notes"><div class="q-label">Notas</div>' + esc(d.notes) + '</div>'
        : '';

      /* QR */
      var qrHTML = d.bizQrUrl
        ? '<div class="q-qr"><img src="' + esc(d.bizQrUrl) + '" alt="QR"></div>'
        : '';

      var html =
        '<button class="q-print-btn" onclick="window.print()">' +
          '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>' +
          ' Imprimir / Guardar PDF' +
        '</button>' +

        '<div class="q-header">' +
          '<div class="q-logo-wrap">' + logoHTML + contactHTML + '</div>' +
          '<div class="q-meta">' +
            '<div class="q-num">' + esc(d.quoteNum || 'COT') + '</div>' +
            '<div class="q-date">' + esc(dateStr) + '</div>' +
          '</div>' +
        '</div>' +

        '<div class="q-client-block">' +
          '<div class="q-label">Para</div>' +
          '<div class="q-client-name">' + esc(d.client || 'Cliente') + '</div>' +
        '</div>' +

        '<div class="q-items">' +
          '<div class="q-items-header">' +
            '<span>Producto</span><span>Cant.</span><span>Precio</span>' +
          '</div>' +
          itemsHTML +
        '</div>' +

        '<div class="q-totals">' + totalsHTML + '</div>' +

        notesHTML +

        '<div class="q-footer">' +
          '<div class="q-footer-biz">' +
            (d.bizName ? '<strong>' + esc(d.bizName) + '</strong>' : '') +
            (d.bizPhone ? esc(d.bizPhone) + '<br>' : '') +
            (d.bizEmail ? esc(d.bizEmail) : '') +
          '</div>' +
          qrHTML +
        '</div>';

      document.getElementById('root').innerHTML = html;
    }

    function showError(msg) {
      document.getElementById('root').innerHTML =
        '<div class="q-error">' +
          '<h2>No se pudo cargar la cotización</h2>' +
          '<p>' + esc(msg) + '</p>' +
        '</div>';
    }

    (function init() {
      var hash = location.hash.slice(1);
      if (!hash) { showError('No se encontraron datos en el link.'); return; }
      try {
        var json = decodeURIComponent(escape(atob(hash)));
        var data = JSON.parse(json);
        render(data);
      } catch (e) {
        showError('El link parece estar dañado o incompleto.');
      }
    })();
  </script>
</body>
</html>
